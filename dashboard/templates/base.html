{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_CODE == 'ar' %}rtl{% else %}ltr{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% trans "Suivi scolaire des élèves et enseignants" %}{% endblock %}</title>

    <!-- Fonts & Icons (Regroupés et nettoyés des doublons) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Plotly (pour les graphiques) -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <!-- TinyMCE (Éditeur de texte) -->
    <script src="https://cdn.tiny.cloud/1/no-api-key/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>

    <!-- Ton CSS personnalisé -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- CSS Spécifique pour l'Arabe si besoin (optionnel) -->
    {% if LANGUAGE_CODE == 'ar' %}
        <link rel="stylesheet" href="{% static 'css/rtl.css' %}">
    {% endif %}
</head>
<body>

    <!-- NAVBAR -->
    {% include "includes/navbar.html" %}

    <!-- CONTENU DES PAGES -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    {% include "includes/footer.html" %}

    <!-- JS GLOBAL -->
    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
