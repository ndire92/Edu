<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mot de passe oublié</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- 👉 COPIE ICI LE CSS DE LA PAGE LOGIN -->
</head>
<style>
    /* =========================
       VARIABLES (Comme le Dashboard)
    ========================= */
    :root {
      --primary: #006233;;
      --primary-dark: #004d26;
      --bg-soft: #f8fafc;
      --text-main: #334155;
      --border: #e2e8f0;
      --danger: #ef4444;
    }

    body {
      font-family: 'Inter', sans-serif;
      /* Dégradé subtil qui correspond au Dashboard */
      background: linear-gradient(135deg, #f5f7fa 0%, #eef2f6 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* =========================
       CARTE DE CONNEXION
    ========================= */
    .login-container {
      width: 100%;
      max-width: 420px; /* Largeur maximale */
      padding: 20px;
    }

    .login-card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      width: 100%;
      text-align: center;
      border-top: 5px solid var(--primary); /* Bordure supérieure violette */
    }

    /* Entête */
    .login-header {
      margin-bottom: 30px;
    }
    .login-icon {
      width: 60px; height: 60px;
      background: #e0e7ff;
      color: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto 15px;
    }
    .login-header h2 {
      margin: 0;
      font-size: 1.8rem;
      color: var(--text-main);
      font-weight: 700;
    }
    .login-header p {
      margin: 0;
      color: #64748b;
      font-size: 0.9rem;
    }

    /* =========================
       CHAMPS DE FORMULAIRE (Inputs)
    ========================= */
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    /* Wrapper pour positionner l'icône à l'intérieur */
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    
    /* L'icône à gauche */
    .input-wrapper i {
      position: absolute;
      left: 15px;
      color: #94a3b8;
      font-size: 1rem;
    }

    .form-input {
      width: 100%;
      padding: 12px 15px 12px 45px; /* Plus de padding à gauche pour l'icône */
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      color: var(--text-main);
      background: var(--bg-soft);
      transition: all 0.3s;
      outline: none;
    }

    /* Effet Focus (Quand on clique) */
    .form-input:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }
input[type="email"] {
  width: 100%;
  padding: 12px 15px 12px 45px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 0.95rem;
  background: var(--bg-soft);
  outline: none;
}

input[type="email"]:focus {
  border-color: var(--primary);
  background: white;
  box-shadow: 0 0 0 3px rgba(0, 98, 51, 0.15);
}

    /* =========================
       BOUTON LOGIN
    ========================= */
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2);
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px rgba(79, 70, 229, 0.3);
    }

    /* Lien inscription en bas */
    .signup-link {
      margin-top: 20px;
      font-size: 0.9rem;
    }
    .signup-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .signup-link a:hover {
      text-decoration: underline;
    }

    /* =========================
       MESSAGES D'ERREUR
    ========================= */
    .error-box {
      background-color: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      border: 1px solid #fecaca;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .error-box i { color: #ef4444; }

    /* =========================
       MOBILE
    ========================= */
    @media (max-width: 480px) {
      .login-card {
        padding: 30px 20px;
        box-shadow: none; /* Ombre supprimée sur mobile */
        border-top: none; /* Bordure supprimée */
      }
      .login-container { padding: 10px; }
    }
  </style>
<body>
<div class="login-container">
  <div class="login-card">

    <div class="login-header">
      <div class="login-icon">
        <i class="fa-solid fa-key"></i>
      </div>
      <h2>Mot de passe oublié</h2>
      <p>Entrez votre email pour recevoir un lien</p>
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <div class="input-wrapper">
          <i class="fa-solid fa-envelope"></i>
          {{ form.email }}
        </div>
      </div>

      <button type="submit" class="btn-login">
        <i class="fa-solid fa-paper-plane"></i> Envoyer le lien
      </button>
    </form>

    <div class="signup-link">
      <a href="{% url 'login' %}">← Retour à la connexion</a>
    </div>

  </div>
</div>
</body>
</html>
