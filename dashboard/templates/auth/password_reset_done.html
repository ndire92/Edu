<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Email envoyé</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', sans-serif;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-container {
        width: 100%;
        max-width: 420px;
        padding: 20px;
    }

    .login-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 40px 30px;
        text-align: center;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .login-icon {
        width: 72px;
        height: 72px;
        background: #e0f2fe;
        color: #0284c7;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        margin: 0 auto 20px;
        font-size: 2.2rem;
    }

    .login-header h2 {
        font-size: 1.5rem;
        color: #0f172a;
        margin-bottom: 6px;
    }

    .login-header p {
        color: #64748b;
        font-size: 0.95rem;
        margin-bottom: 20px;
    }

    .login-card p {
        color: #475569;
        font-size: 0.95rem;
        line-height: 1.5;
        margin-bottom: 25px;
    }

    .signup-link a {
        display: inline-block;
        text-decoration: none;
        padding: 12px 26px;
        border-radius: 10px;
        background: #0284c7;
        color: white;
        font-weight: 500;
        transition: all 0.3s ease;
    }

    .signup-link a:hover {
        background: #0369a1;
        transform: translateY(-2px);
    }
</style>
</head>

<body>

<div class="login-container">
    <div class="login-card">

        <div class="login-icon">
            <i class="fa-solid fa-envelope-circle-check"></i>
        </div>

        <div class="login-header">
            <h2>Email envoyé</h2>
            <p>Vérifiez votre boîte mail</p>
        </div>

        <p>
            Si un compte existe avec cet email, un lien de réinitialisation vient d’être envoyé.
        </p>

        <div class="signup-link">
            <a href="{% url 'login' %}">
                <i class="fa-solid fa-arrow-left"></i> Retour à la connexion
            </a>
        </div>

    </div>
</div>

</body>
</html>
