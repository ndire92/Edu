<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation du mot de passe</title>
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Police Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #006233; /* Vert forêt (comme votre original) */
            --primary-hover: #004d28;
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #1e293b;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-border: #cbd5f5;
            --input-focus: #006233;
            --error-color: #ef4444;
            --success-color: #10b981;
            --warning-color: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 45px 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header Section */
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-icon {
            width: 80px;
            height: 80px;
            background: rgba(0, 98, 51, 0.1); /* Version subtile du vert */
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto 20px;
            font-size: 2.2rem;
            transition: transform 0.3s ease;
        }

        .login-card:hover .login-icon {
            transform: scale(1.05);
        }

        .login-header h2 {
            font-size: 1.75rem;
            color: var(--text-main);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.5;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i.lock-icon {
            position: absolute;
            top: 50%;
            left: 16px;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1rem;
            z-index: 2;
            transition: color 0.3s;
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 45px 16px 45px; /* Espace pour l'icône gauche et l'oeil droite */
            border-radius: 12px;
            border: 2px solid var(--input-border);
            font-size: 1rem;
            color: var(--text-main);
            background: #f8fafc;
            outline: none;
            transition: all 0.3s ease;
        }

        /* État Focus */
        .input-wrapper input:focus {
            border-color: var(--input-focus);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(0, 98, 51, 0.1);
        }

        .input-wrapper input:focus + i.lock-icon {
            color: var(--input-focus);
        }

        /* État Erreur */
        .input-wrapper.error input {
            border-color: var(--error-color);
            background: #fef2f2;
        }
        .input-wrapper.error i.lock-icon {
            color: var(--error-color);
        }

        /* Bouton Oeil (Visibilité) */
        .toggle-password {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            font-size: 1.1rem;
            z-index: 3;
            padding: 5px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--text-main);
        }

        /* Barre de force du mot de passe */
        .strength-meter {
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
            display: flex;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            background: var(--error-color);
            transition: width 0.4s ease, background-color 0.4s ease;
        }

        .strength-text {
            font-size: 0.8rem;
            margin-top: 6px;
            text-align: right;
            color: var(--text-muted);
            min-height: 1.2em;
            font-weight: 500;
        }

        /* Message d'erreur de correspondance */
        .match-feedback {
            font-size: 0.85rem;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .match-feedback.visible {
            opacity: 1;
        }

        .match-feedback.error { color: var(--error-color); }
        .match-feedback.success { color: var(--success-color); }

        /* Bouton Submit */
        .btn-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: var(--primary-color);
            color: white;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(0, 98, 51, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Toast Notification (Remplacement de alert) */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            pointer-events: none;
        }

        .toast {
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: 0.95rem;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success i { color: var(--success-color); }
        .toast.error i { color: var(--error-color); }

        /* Spinner pour chargement */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">

        <div class="login-header">
            <div class="login-icon">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2>Nouveau mot de passe</h2>
            <p>Entrez votre nouveau mot de passe ci-dessous.</p>
        </div>

        <!--
           NOTE POUR DJANGO :
           Dans votre template Django réel, remplacez les balises <input> ci-dessous par :
           {{ form.new_password1 }}
           {{ form.new_password2 }}
           Et ajoutez les classes/attributs nécessaires via vos widgets Django.
        -->

        <form id="resetForm" novalidate>
            <!-- Token CSRF (Django) -->
            <input type="hidden" name="csrfmiddlewaretoken" value="simulated-token">

            <div class="form-group">
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock lock-icon"></i>
                    <!-- Simulation champ Django -->
                    <input type="password" id="id_new_password1" name="new_password1" placeholder="Nouveau mot de passe" required autocomplete="new-password">
                    <button type="button" class="toggle-password" data-target="id_new_password1">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>

                <!-- Indicateur de force -->
                <div class="strength-meter">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
                <div class="strength-text" id="strengthText"></div>
            </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock lock-icon"></i>
                    <!-- Simulation champ Django -->
                    <input type="password" id="id_new_password2" name="new_password2" placeholder="Confirmer le mot de passe" required autocomplete="new-password">
                    <button type="button" class="toggle-password" data-target="id_new_password2">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
                <!-- Feedback de correspondance -->
                <div class="match-feedback" id="matchFeedback">
                    <i class="fa-solid fa-circle-info"></i>
                    <span id="matchText">Les mots de passe ne correspondent pas</span>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-text">Réinitialiser le mot de passe</span>
                <div class="spinner"></div>
                <i class="fa-solid fa-arrow-right icon-btn"></i>
            </button>
        </form>

    </div>
</div>

<!-- Système de Toast Notification -->
<div class="toast-container">
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastMessage">Message ici</span>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const password1 = document.getElementById('id_new_password1');
        const password2 = document.getElementById('id_new_password2');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');
        const matchFeedback = document.getElementById('matchFeedback');
        const matchText = document.getElementById('matchText');
        const toggleBtns = document.querySelectorAll('.toggle-password');
        const form = document.getElementById('resetForm');
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.querySelector('.spinner');
        const btnText = document.querySelector('.btn-text');
        const iconBtn = document.querySelector('.icon-btn');

        // --- 1. Gestion de la visibilité des mots de passe ---
        toggleBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const targetId = btn.getAttribute('data-target');
                const input = document.getElementById(targetId);
                const icon = btn.querySelector('i');

                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                    icon.style.color = 'var(--primary-color)';
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                    icon.style.color = '';
                }
            });
        });

        // --- 2. Calculateur de force du mot de passe ---
        password1.addEventListener('input', () => {
            const val = password1.value;
            let strength = 0;
            let status = '';

            if (val.length > 0) {
                // Règles simples de complexité
                if (val.length >= 8) strength += 1;
                if (val.match(/[a-z]+/)) strength += 1;
                if (val.match(/[A-Z]+/)) strength += 1;
                if (val.match(/[0-9]+/)) strength += 1;
                if (val.match(/[$@#&!]+/)) strength += 1;
            }

            // Mise à jour visuelle
            switch (strength) {
                case 0:
                    strengthBar.style.width = '0%';
                    strengthText.innerText = '';
                    break;
                case 1:
                case 2:
                    strengthBar.style.width = '30%';
                    strengthBar.style.backgroundColor = 'var(--error-color)';
                    strengthText.innerText = 'Faible';
                    strengthText.style.color = 'var(--error-color)';
                    break;
                case 3:
                case 4:
                    strengthBar.style.width = '70%';
                    strengthBar.style.backgroundColor = 'var(--warning-color)';
                    strengthText.innerText = 'Moyen';
                    strengthText.style.color = 'var(--warning-color)';
                    break;
                case 5:
                    strengthBar.style.width = '100%';
                    strengthBar.style.backgroundColor = 'var(--success-color)';
                    strengthText.innerText = 'Excellent';
                    strengthText.style.color = 'var(--success-color)';
                    break;
            }
        });

        // --- 3. Validation de correspondance en temps réel ---
        const checkMatch = () => {
            if (password2.value === '') {
                matchFeedback.classList.remove('visible', 'error', 'success');
                return false;
            }

            if (password1.value === password2.value) {
                matchFeedback.classList.add('visible', 'success');
                matchFeedback.classList.remove('error');
                matchText.innerText = 'Les mots de passe correspondent';
                matchFeedback.querySelector('i').className = 'fa-solid fa-check-circle';
                return true;
            } else {
                matchFeedback.classList.add('visible', 'error');
                matchFeedback.classList.remove('success');
                matchText.innerText = 'Les mots de passe ne correspondent pas';
                matchFeedback.querySelector('i').className = 'fa-solid fa-circle-xmark';
                return false;
            }
        };

        password2.addEventListener('input', checkMatch);
        password1.addEventListener('input', checkMatch);

        // --- 4. Soumission du formulaire ---
        form.addEventListener('submit', (e) => {
            e.preventDefault(); // Empêche la soumission réelle pour cette démo

            const p1 = password1.value;
            const p2 = password2.value;

            // Validation basique
            if (p1.length < 8) {
                showToast('Le mot de passe doit contenir au moins 8 caractères.', 'error');
                password1.focus();
                password1.parentElement.classList.add('error');
                return;
            } else {
                password1.parentElement.classList.remove('error');
            }

            if (p1 !== p2) {
                showToast('Les mots de passe ne sont pas identiques.', 'error');
                password2.focus();
                password2.parentElement.classList.add('error');
                return;
            } else {
                password2.parentElement.classList.remove('error');
            }

            // Simulation d'envoi (Loading state)
            startLoading();

            // Simulation d'un délai réseau (ex: 2 secondes)
            setTimeout(() => {
                stopLoading();
                showToast('Mot de passe modifié avec succès !', 'success');
                setTimeout(() => { window.location.href = '/login/'; }, 2);
                // Ici, vous feriez form.submit() en production si validé côté serveur
                form.reset();
                strengthBar.style.width = '0%';
                strengthText.innerText = '';
                matchFeedback.classList.remove('visible');
            }, 2);
        });

        // --- Fonctions utilitaires ---

        function startLoading() {
            submitBtn.disabled = true;
            spinner.style.display = 'block';
            btnText.style.display = 'none';
            iconBtn.style.display = 'none';
            submitBtn.style.opacity = '0.8';
            submitBtn.style.cursor = 'not-allowed';
        }

        function stopLoading() {
            submitBtn.disabled = false;
            spinner.style.display = 'none';
            btnText.style.display = 'block';
            iconBtn.style.display = 'block';
            submitBtn.style.opacity = '1';
            submitBtn.style.cursor = 'pointer';
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const msgSpan = document.getElementById('toastMessage');
            const icon = toast.querySelector('i');

            msgSpan.innerText = message;

            toast.className = `toast ${type}`;
            if(type === 'success') {
                icon.className = 'fa-solid fa-circle-check';
            } else {
                icon.className = 'fa-solid fa-circle-exclamation';
            }

            toast.classList.add('show');

            // Cacher après 3 secondes
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    });
</script>

</body>
</html>
